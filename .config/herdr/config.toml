onboarding = false
# herdr config — symlinked to ~/.config/herdr/config.toml
# Reload with: herdr server reload-config (or prefix+shift+r)

[keys]
# alt+1..9 focuses agent rows directly (no prefix).
focus_agent = "alt+1..9"
# alt+hjkl moves pane focus directly (prefix bindings kept).
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

[theme]
name = "tokyo-night"
auto_switch = false
